# Builds Punch on every push to main and publishes the APK to the punch-apk branch (Punch.apk).
# Optional repository secrets EJ_SERVICE, EJ_TEMPLATE, EJ_KEY turn on password reset by mail (EmailJS).
name: Punch build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Fill in the mail settings from secrets
        env:
          EJS: ${{ secrets.EJ_SERVICE }}
          EJT: ${{ secrets.EJ_TEMPLATE }}
          EJK: ${{ secrets.EJ_KEY }}
        shell: bash
        run: |
          F=app/src/main/assets/index.html
          python3 - "$F" <<'PY'
          import os, sys
          p = sys.argv[1]; s = open(p).read()
          for k, v in (("__EJ_SERVICE__", "EJS"), ("__EJ_TEMPLATE__", "EJT"), ("__EJ_KEY__", "EJK")):
              val = os.environ.get(v, "").replace("\\", "").replace("'", "")
              if val: s = s.replace(k, val)
          open(p, "w").write(s)
          PY
      - name: Build
        id: build
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease bundleRelease --no-daemon 2>&1 | tee build.log
      # Signing: the old key (app/punch.keystore) was public, so builds are rotated to a private key kept only in the
      # PUNCH_KEYSTORE / PUNCH_KS_PASS secrets (APK Signature Scheme v3 key rotation). Phones on Android 9+ that already have
      # Punch update normally and from then on trust only the new key; an APK signed with just the old key can no longer
      # replace it (rollback off). Without the secrets the build is signed with the old key as before.
      - name: Sign with the private key (key rotation)
        id: sign
        if: steps.build.outcome == 'success'
        env:
          KS: ${{ secrets.PUNCH_KEYSTORE }}
          KSP: ${{ secrets.PUNCH_KS_PASS }}
        shell: bash
        run: |
          set -e
          mkdir -p out
          IN=app/build/outputs/apk/release/app-release.apk
          if [ -z "$KS" ] || [ -z "$KSP" ]; then cp "$IN" out/Punch.apk; echo "signing: old key (secrets PUNCH_KEYSTORE / PUNCH_KS_PASS not set)" > out/signing.txt; exit 0; fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1); AS="$BT/apksigner"
          echo "$KS" | base64 -d > "$RUNNER_TEMP/new.jks"
          "$AS" rotate --out "$RUNNER_TEMP/lineage" \
            --old-signer --ks app/punch.keystore --ks-pass pass:punch1234 --ks-key-alias punch \
            --new-signer --ks "$RUNNER_TEMP/new.jks" --ks-pass env:KSP --ks-key-alias punch2
          "$AS" lineage --in "$RUNNER_TEMP/lineage" --out "$RUNNER_TEMP/lineage" \
            --signer --ks app/punch.keystore --ks-pass pass:punch1234 --ks-key-alias punch --set-rollback false
          "$AS" sign --ks app/punch.keystore --ks-pass pass:punch1234 --ks-key-alias punch \
            --next-signer --ks "$RUNNER_TEMP/new.jks" --ks-pass env:KSP --ks-key-alias punch2 \
            --lineage "$RUNNER_TEMP/lineage" --rotation-min-sdk-version 28 --out out/Punch.apk "$IN"
          "$AS" verify --print-certs -v out/Punch.apk | grep -E "Verified using|Signer|SHA-1|rotation" | head -20 > out/signing.txt || true
          AAB=app/build/outputs/bundle/release/app-release.aab
          if [ -f "$AAB" ]; then cp "$AAB" out/Punch.aab; zip -q -d out/Punch.aab 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' 'META-INF/MANIFEST.MF' || true
            jarsigner -keystore "$RUNNER_TEMP/new.jks" -storepass "$KSP" -sigalg SHA256withRSA -digestalg SHA-256 out/Punch.aab punch2 >/dev/null; fi
          rm -f "$RUNNER_TEMP/new.jks"
          cat out/signing.txt
      - name: Publish APK and status
        if: always()
        shell: bash
        run: |
          mkdir -p out
          { echo "commit: ${GITHUB_SHA::7}"; echo "result: ${{ steps.build.outcome }}"; echo "sign: ${{ steps.sign.outcome }}"; grep -E "error:|FAILED|AAPT|What went wrong" build.log | head -60 || true; } > out/status.txt
          cat out/status.txt
          cd out && git init -q && git checkout -q -b punch-apk && git add . 
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "Punch build ${GITHUB_SHA::7}: ${{ steps.build.outcome }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" punch-apk
